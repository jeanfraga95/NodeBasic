<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title> 
    <style>
        body{
            font:normal 20px Arial, Helvetica, sans-serif;
            margin-top: 10px;
            font-weight: bold;
        }
        input{
            font:normal 18pt arial, helvetica, sans-serif;
            width: 100px;
        }
        div#res{
            font:normal 20pt arial, helvetica, sans-serif;
            color: blue;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <input type="number" id="num1" name="n1" placeholder="Digite o primeiro número">
    <input type="number" id="num2" name="n2" placeholder="Digite o segundo número">
    <input type="button" id="num3" value="Somar">
    <div id="res">Resultado</div>

    <script>
        let num1 = document.querySelector('#num1');
        let num2 = document.querySelector('#num2');
        let num3 = document.querySelector('#num3');
        let res = document.querySelector('#res');

        num3.addEventListener('click', somar);

        function somar(){
            let n1 = Number(num1.value);
            let n2 = Number(num2.value);
            let soma = n1 + n2;
            res.innerHTML = `Resultado: ${soma} é a soma de ${n1} + ${n2}`;
        }
    </script>
</body>
</html>
